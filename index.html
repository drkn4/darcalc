<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<title>Calculator</title>

<style>
:root{
  --bg:#d1d5db;
  --history:#d9fbe8;
  --display:#ffffff;
  --num:#f8fafc;
  --ctrl:#6b7280;
  --op:#f59e0b;
  --equal:#f87171;
  --ac:#dc2626;
  --text:#111827;
  --border:#374151;
  --modal:#ffffff;
  --history-full:#111827;
  --history-full-header:#1f2937;
}

body.dark{
  --bg:#111827;
  --history:#d9fbe8;
  --display:#111827;
  --num:#1f2937;
  --ctrl:#374151;
  --op:#d97706;
  --equal:#ef4444;
  --ac:#b91c1c;
  --text:#f9fafb;
  --border:#ffffff;
  --modal:#1f2937;
  --history-full:#050816;
  --history-full-header:#111827;
}

*{
  box-sizing:border-box;
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}

body{
  margin:0;
  background:var(--bg);
  font-family:sans-serif;
  color:var(--text);
}

.app{
  width:100%;
  max-width:390px;
  height:100dvh;
  margin:auto;
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:7px;
}

#topBar{
  height:34px;
  display:flex;
  align-items:center;
}

#settingsBtn{
  width:44px;
  height:34px;
  border-radius:12px;
  font-size:20px;
  background:#4b5563;
  color:#fff;
  border:3px solid var(--border);
}

#historyBox{
  background:var(--history);
  color:#111827;
  border-radius:14px;
  padding:8px;
  height:18dvh;
  min-height:105px;
  max-height:155px;
  overflow:auto;
  text-align:right;
  font-size:clamp(15px,4.4vw,21px);
  font-weight:bold;
  line-height:1.25;
}

.history-item{
  padding:2px 4px;
  border-bottom:1px solid rgba(0,0,0,0.08);
  transition:background .18s, box-shadow .18s;
}

.history-flash{
  background:rgba(255,255,255,.95) !important;
  box-shadow:0 0 14px rgba(255,255,255,.95);
}

.live{
  color:#111827;
  background:#dff8ff;
  border:2px solid #7dd3fc;
  border-radius:10px;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,0.7);
}

.select-row{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  text-align:right;
}

.select-row input{
  width:24px;
  height:24px;
}

#displayWrap{
  position:relative;
}

#operator{
  position:absolute;
  left:12px;
  top:5px;
  font-size:30px;
  font-weight:bold;
  color:var(--text);
  opacity:.85;
}

#display{
  width:100%;
  height:68px;
  font-size:clamp(34px,10vw,44px);
  text-align:right;
  background:var(--display);
  color:var(--text);
  border:3px solid var(--border);
  border-radius:16px;
  padding:8px 12px;
}

.grid{
  flex:1;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  grid-auto-rows:1fr;
  gap:8px;
  min-height:0;
}

button{
  width:100%;
  height:70px;
  border-radius:15px;
  border:3px solid var(--border);
  font-weight:bold;
  box-shadow:0 4px 0 rgba(0,0,0,0.35);
  transition:0.08s;
  touch-action:manipulation;
  min-height:0;
  font-size:34px;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 rgba(0,0,0,0.35);
}

.ac{
  background:var(--ac);
  color:#fff;
}

.ac:active{
  transform:translateY(8px);
}

.ctrl{
  background:var(--ctrl);
  color:#fff;
}

.topFunc{
  height:58px;
  align-self:center;
  font-size:25px;
}

.ac.topFunc{
  font-size:28px;
}

#freeBtn{
  white-space:nowrap;
  font-size:23px;
}

.num{
  background:var(--num);
  color:var(--text);
}

.op{
  background:var(--op);
  color:#fff;
}

.equal{
  background:var(--equal);
  color:#fff;
  grid-row:span 2;
  height:100%;
}

.small{
  display:block;
  font-size:11px;
  opacity:.9;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  justify-content:center;
  align-items:center;
  z-index:20;
  padding:18px;
}

#modalContent{
  background:var(--modal);
  color:var(--text);
  width:100%;
  max-width:360px;
  border-radius:22px;
  padding:24px;
  box-shadow:0 12px 30px rgba(0,0,0,.35);
}

#modalContent h3{
  margin-top:0;
  font-size:26px;
}

.settingItem{
  margin-bottom:18px;
}

.settingItem label{
  display:block;
  font-size:18px;
  margin-bottom:8px;
}

.settingItem input[type="number"],
.settingItem input[type="text"],
.settingItem select{
  width:100%;
  padding:12px;
  font-size:22px;
  border:2px solid #9ca3af;
  border-radius:10px;
  background:var(--display);
  color:var(--text);
  -webkit-user-select:text;
  user-select:text;
}

.checkRow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px 0;
  font-size:20px;
}

.checkRow input{
  width:30px;
  height:30px;
}

.modalButtons{
  display:flex;
  gap:12px;
  margin-top:16px;
}

.modalButtons button{
  height:56px;
  flex:1;
  font-size:18px;
  background:#f3f4f6;
  color:#111827;
  border:3px solid #374151;
}

#historyFull{
  display:none;
  position:fixed;
  inset:0;
  background:var(--history-full);
  color:#fff;
  z-index:80;
  flex-direction:column;
}

#historyFullHeader{
  min-height:56px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:8px 14px;
  background:var(--history-full-header);
  font-size:20px;
  font-weight:bold;
}

#historyFullHeader button{
  height:40px;
  color:#111;
  background:#fff;
  padding:0 14px;
  font-size:15px;
  border:3px solid #fff;
}

.fullHeaderControls{
  display:flex;
  align-items:center;
  gap:12px;
}

.resultOnlyLabel{
  display:flex;
  align-items:center;
  gap:6px;
  font-size:15px;
  font-weight:bold;
  white-space:nowrap;
}

.resultOnlyLabel input{
  width:22px;
  height:22px;
}

#historyFullList{
  flex:1;
  overflow:auto;
  padding:10px;
  text-align:right;
  font-size:22px;
  font-weight:bold;
}

#historyFullList .history-item{
  border-bottom:1px solid rgba(255,255,255,0.18);
}

#fullActionBar{
  display:flex;
  gap:8px;
  padding:10px;
  background:var(--history-full-header);
}

#fullActionBar button{
  height:46px;
  flex:1;
  color:#111;
  background:#fff;
  font-size:15px;
  border:3px solid #fff;
}

@media (min-width:600px){
  .app{ max-width:460px; }

  #historyBox{
    height:28dvh;
    max-height:260px;
  }

  button{
    height:70px;
    font-size:34px;
  }

  .topFunc{ height:58px; }

  #display{ height:72px; }
}

@media (min-width:900px){
  .app{ max-width:480px; }

  #historyBox{
    height:34dvh;
    max-height:340px;
  }
}
</style>
</head>

<body>
<div class="app">

  <div id="topBar">
    <button id="settingsBtn" onclick="openSettings()">⚙</button>
  </div>

  <div id="historyBox"
       oncontextmenu="return false"
       onpointerdown="startFullHistoryHold()"
       onpointerup="cancelFullHistoryHold()"
       onpointerleave="cancelFullHistoryHold()"></div>

  <div id="displayWrap">
    <div id="operator"></div>
    <input id="display" readonly>
  </div>

  <div class="grid">
    <button class="ac topFunc" onclick="clearAll()">AC</button>

    <button class="ctrl topFunc" onclick="taxOut()" id="taxOutBtn">
      税抜<span class="small"></span>
    </button>

    <button class="ctrl topFunc" onclick="taxIn()" id="taxInBtn">
      税込<span class="small"></span>
    </button>

    <button class="ctrl topFunc" onclick="runFree()" id="freeBtn">
      F1<span class="small"></span>
    </button>

    <button class="ctrl" onclick="clearEntry()">C</button>
    <button class="ctrl" onclick="backspace()">⌫</button>
    <button class="ctrl" onclick="percent()">％</button>
    <button class="op" onclick="pressOperator('/')">÷</button>

    <button class="num" onclick="pressNumber('7')">7</button>
    <button class="num" onclick="pressNumber('8')">8</button>
    <button class="num" onclick="pressNumber('9')">9</button>
    <button class="op" onclick="pressOperator('*')">×</button>

    <button class="num" onclick="pressNumber('4')">4</button>
    <button class="num" onclick="pressNumber('5')">5</button>
    <button class="num" onclick="pressNumber('6')">6</button>
    <button class="op" onclick="pressOperator('-')">－</button>

    <button class="num" onclick="pressNumber('1')">1</button>
    <button class="num" onclick="pressNumber('2')">2</button>
    <button class="num" onclick="pressNumber('3')">3</button>
    <button class="op" onclick="pressOperator('+')">＋</button>

    <button class="num" onclick="pressNumber('0')">0</button>
    <button class="num" onclick="pressNumber('00')">00</button>
    <button class="num" onclick="pressDot()">.</button>
    <button class="equal" onclick="calc()">＝</button>
  </div>

</div>

<div id="modal">
  <div id="modalContent">
    <h3>設定</h3>

    <div class="settingItem">
      <label>税率（%）</label>
      <input id="taxInput" type="number">
    </div>

    <div class="settingItem">
      <label>F1式（例：×1.1 / ÷2 / +500）</label>
      <input id="freeInput" type="text">
    </div>

    <div class="settingItem">
      <label>小数点以下の桁数</label>
      <select id="decimalSelect">
        <option value="1">1桁</option>
        <option value="2">2桁</option>
        <option value="3">3桁</option>
        <option value="4">4桁</option>
        <option value="5">5桁</option>
        <option value="6">6桁</option>
        <option value="7">7桁</option>
        <option value="8">8桁</option>
        <option value="9">9桁</option>
        <option value="10">10桁</option>
      </select>
    </div>

    <div class="checkRow">
      <span>振動</span>
      <input type="checkbox" id="vibCheck">
    </div>

    <div class="checkRow">
      <span>ダークモード</span>
      <input type="checkbox" id="darkCheck">
    </div>

    <div class="modalButtons">
      <button onclick="saveSettings()">保存</button>
      <button onclick="closeSettings()">閉じる</button>
    </div>
  </div>
</div>

<div id="historyFull" oncontextmenu="return false">
  <div id="historyFullHeader">
    <span>履歴</span>

    <div class="fullHeaderControls">
      <label class="resultOnlyLabel">
        <input type="checkbox" id="resultOnlyCheck" onchange="toggleResultOnly()">
        結果のみ表示
      </label>
      <button onclick="closeHistoryFull()">閉じる</button>
    </div>
  </div>

  <div id="historyFullList"></div>

  <div id="fullActionBar">
    <button onclick="selectAll()">全選択</button>
    <button onclick="deleteSelected()">削除</button>
    <button onclick="copySelected()">コピー</button>
    <button onclick="clearSelection()">解除</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);

const els = {
  body: document.body,
  display: $("display"),
  operator: $("operator"),
  historyBox: $("historyBox"),
  historyFull: $("historyFull"),
  historyFullList: $("historyFullList"),
  taxInBtn: $("taxInBtn"),
  taxOutBtn: $("taxOutBtn"),
  freeBtn: $("freeBtn"),
  modal: $("modal"),
  taxInput: $("taxInput"),
  freeInput: $("freeInput"),
  vibCheck: $("vibCheck"),
  darkCheck: $("darkCheck"),
  decimalSelect: $("decimalSelect"),
  resultOnlyCheck: $("resultOnlyCheck")
};

let current = "";
let expression = "";
let justCalculated = false;
let waitingForNextNumber = false;
let lastOperator = "";

let constantOp = "";
let constantValue = "";

let taxRate = Number(localStorage.getItem("taxRate")) || 10;
let freeExpr = localStorage.getItem("freeExpr") || "";
let vibration = localStorage.getItem("vibration") !== "false";
let resultOnly = localStorage.getItem("resultOnly") === "true";
let darkMode = localStorage.getItem("darkMode") === "true";
let decimalPlaces = Number(localStorage.getItem("decimalPlaces")) || 2;

let historyLog = JSON.parse(localStorage.getItem("historyLog")) || [];
let selected = new Set();

let fullHoldTimer = null;
let historyTapBlocked = false;
let pendingFlashId = null;

let lastHistoryHTML = "";
let lastFullHistoryHTML = "";

function applyTheme(){
  els.body.classList.toggle("dark", darkMode);
}

function vib(ms = 50){
  if(vibration && navigator.vibrate) navigator.vibrate(ms);
}

function roundNum(n){
  return Number(Number(n).toFixed(decimalPlaces));
}

function fmtNum(n){
  if(n === "" || n === null || n === undefined) return "0";
  const num = Number(n);
  if(!isFinite(num)) return "0";
  return num.toLocaleString(undefined,{
    minimumFractionDigits:0,
    maximumFractionDigits:decimalPlaces
  });
}

function symbol(s){
  return {"+":"＋","-":"－","*":"×","/":"÷","=":"＝"}[s] || s;
}

function normalizeExpr(str){
  return str
    .replace(/\*/g,"×")
    .replace(/\//g,"÷")
    .replace(/\+/g,"＋")
    .replace(/-/g,"－");
}

function displayExpr(){
  if(expression === "" && current === "") return "0";

  if(waitingForNextNumber){
    return normalizeExpr(expression);
  }

  return normalizeExpr(expression + current);
}

function calcPreview(){
  if(waitingForNextNumber) return "";
  if(expression === "") return "";
  if(current === "") return "";

  const live = expression + current;

  if(/[+\-*/]$/.test(live)) return "";

  try{
    const r = Function("return " + live)();
    if(!isFinite(r)) return "";
    return fmtNum(roundNum(r));
  }catch{
    return "";
  }
}

function update(){
  els.display.value = current ? fmtNum(current) : "0";

  if(justCalculated){
    els.operator.innerText = "＝";
  }else{
    els.operator.innerText = lastOperator ? symbol(lastOperator) : "";
  }

  els.taxInBtn.querySelector(".small").innerText = "+" + taxRate + "%";
  els.taxOutBtn.querySelector(".small").innerText = "-" + taxRate + "%";
  els.freeBtn.querySelector(".small").innerText = freeExpr || "未設定";

  renderHistory();
}

function buildLiveHTML(){
  const live = displayExpr();
  const liveResult = calcPreview();

  return `<div class="history-item live">${live}${liveResult ? "＝" + liveResult : ""}</div>`;
}

function renderHistory(){
  let html = buildLiveHTML();

  html += historyLog.map((item, i) =>
    `<div class="history-item ${pendingFlashId === i ? "history-flash" : ""}" id="hist-${i}" onclick="reuseHistoryExpression(${i}); event.stopPropagation();">${item.text}</div>`
  ).join("");

  if(html !== lastHistoryHTML){
    els.historyBox.innerHTML = html;
    lastHistoryHTML = html;
  }

  if(els.historyFull.style.display === "flex"){
    renderHistoryFull();
  }
}

function historyDisplayText(item){
  return resultOnly ? fmtNum(item.result) : item.text;
}

function renderHistoryFull(){
  let html = buildLiveHTML();

  html += historyLog.map((item, i)=>{
    return `
      <div class="history-item select-row" onclick="toggleSelect(${i})">
        <span>${historyDisplayText(item)}</span>
        <input type="checkbox" ${selected.has(i) ? "checked" : ""}>
      </div>
    `;
  }).join("");

  if(html !== lastFullHistoryHTML){
    els.historyFullList.innerHTML = html;
    lastFullHistoryHTML = html;
  }

  els.resultOnlyCheck.checked = resultOnly;
}

function saveHistory(expr, result){
  historyLog.unshift({
    expr,
    result,
    text: `${normalizeExpr(expr)}＝${fmtNum(result)}`
  });

  if(historyLog.length > 30){
    historyLog = historyLog.slice(0,30);
  }

  localStorage.setItem("historyLog", JSON.stringify(historyLog));
  lastHistoryHTML = "";
  lastFullHistoryHTML = "";
}

function reuseHistoryExpression(i){
  if(historyTapBlocked) return;

  const item = historyLog[i];
  if(!item) return;

  vib(35);
  pendingFlashId = i;
  lastHistoryHTML = "";
  renderHistory();

  setTimeout(()=>{
    pendingFlashId = null;
    lastHistoryHTML = "";
    renderHistory();
  },220);

  const expr = item.expr || "";
  const match = expr.match(/^(.*[+\-*/])([^+\-*/]*)$/);

  if(match){
    expression = match[1];
    current = match[2];
    lastOperator = expression.slice(-1);
    waitingForNextNumber = current === "";
  }else{
    expression = "";
    current = expr;
    lastOperator = "";
    waitingForNextNumber = false;
  }

  justCalculated = false;
  update();
}

function pressNumber(n){
  vib();

  if(justCalculated){
    current = "";
    expression = "";
    justCalculated = false;
    waitingForNextNumber = false;
    lastOperator = "";
  }

  if(waitingForNextNumber){
    current = "";
    waitingForNextNumber = false;
  }

  if(current === "0" && n !== "00"){
    current = "";
  }

  if(current === "0" && n === "00"){
    return;
  }

  current += n;
  current = current.replace(/^0+(?=\d)/, "");

  update();
}

function pressDot(){
  vib();

  if(justCalculated){
    current = "";
    expression = "";
    justCalculated = false;
    waitingForNextNumber = false;
    lastOperator = "";
  }

  if(waitingForNextNumber){
    current = "";
    waitingForNextNumber = false;
  }

  if(current === ""){
    current = "0.";
  }else if(!current.includes(".")){
    current += ".";
  }

  update();
}

function pressOperator(nextOp){
  vib();

  if(current === "" && expression === ""){
    return;
  }

  if(waitingForNextNumber && expression !== ""){
    expression = expression.slice(0, -1) + nextOp;
    lastOperator = nextOp;
    update();
    return;
  }

  expression += current + nextOp;
  lastOperator = nextOp;
  waitingForNextNumber = true;
  justCalculated = false;

  constantOp = "";
  constantValue = "";

  update();
}

function calc(){
  let expr = expression + current;

  if(justCalculated && constantOp && constantValue !== ""){
    expr = current + constantOp + constantValue;
  }else{
    if(expr === "") return;
    if(/^[0-9.]+$/.test(expr)) return;
    if(/[+\-*/]$/.test(expr)){
      expr = expr + current;
    }
  }

  try{
    vib();

    const r = Function("return " + expr)();

    if(!isFinite(r)){
      throw new Error();
    }

    const result = roundNum(r);

    const match = expr.match(/^(.*)([+\-*/])([^+\-*/]+)$/);
    if(match){
      constantOp = match[2];
      constantValue = match[3];
    }

    saveHistory(expr, result);

    current = String(result);
    expression = "";
    justCalculated = true;
    waitingForNextNumber = false;
    lastOperator = "";

    update();
  }catch{
    current = "";
    expression = "";
    justCalculated = false;
    waitingForNextNumber = false;
    lastOperator = "";
    constantOp = "";
    constantValue = "";
    els.display.value = "エラー";
  }
}

function clearAll(){
  vib();
  current = "";
  expression = "";
  justCalculated = false;
  waitingForNextNumber = false;
  lastOperator = "";
  constantOp = "";
  constantValue = "";
  update();
}

function clearEntry(){
  vib();
  current = "";
  justCalculated = false;
  waitingForNextNumber = false;
  update();
}

function backspace(){
  vib();

  if(justCalculated){
    clearAll();
    return;
  }

  if(waitingForNextNumber){
    return;
  }

  current = current.slice(0,-1);
  update();
}

function percent(){
  vib();

  if(current === ""){
    return;
  }

  current = String(roundNum(parseFloat(current) / 100));
  update();
}

function taxIn(){
  vib();
  const before = parseFloat(current || 0);
  const result = roundNum(before * (1 + taxRate / 100));

  saveHistory(`${before}*${1 + taxRate / 100}`, result);

  current = String(result);
  expression = "";
  justCalculated = true;
  waitingForNextNumber = false;
  lastOperator = "";
  update();
}

function taxOut(){
  vib();
  const before = parseFloat(current || 0);
  const result = roundNum(before / (1 + taxRate / 100));

  saveHistory(`${before}/${1 + taxRate / 100}`, result);

  current = String(result);
  expression = "";
  justCalculated = true;
  waitingForNextNumber = false;
  lastOperator = "";
  update();
}

function runFree(){
  vib();

  if(!freeExpr){
    alert("設定画面でF1式を設定してね");
    return;
  }

  try{
    const before = parseFloat(current || 0);
    const expr = freeExpr.replace(/×/g,"*").replace(/÷/g,"/");
    const r = Function("return " + before + expr)();

    if(!isFinite(r)){
      throw new Error();
    }

    const result = roundNum(r);

    saveHistory(`${before}${expr}`, result);

    current = String(result);
    expression = "";
    justCalculated = true;
    waitingForNextNumber = false;
    lastOperator = "";
    update();
  }catch{
    alert("F1式エラー");
  }
}

function startFullHistoryHold(){
  historyTapBlocked = false;

  fullHoldTimer = setTimeout(()=>{
    historyTapBlocked = true;
    openHistoryFull();
  },600);
}

function cancelFullHistoryHold(){
  clearTimeout(fullHoldTimer);
  setTimeout(()=>{ historyTapBlocked = false; },80);
}

function openHistoryFull(){
  els.historyFull.style.display = "flex";
  els.resultOnlyCheck.checked = resultOnly;
  lastFullHistoryHTML = "";
  renderHistoryFull();
}

function closeHistoryFull(){
  els.historyFull.style.display = "none";
  selected.clear();
  lastFullHistoryHTML = "";
  renderHistory();
}

function toggleResultOnly(){
  resultOnly = els.resultOnlyCheck.checked;
  localStorage.setItem("resultOnly", resultOnly);
  lastFullHistoryHTML = "";
  renderHistoryFull();
}

function toggleSelect(i){
  selected.has(i) ? selected.delete(i) : selected.add(i);
  lastFullHistoryHTML = "";
  renderHistoryFull();
}

function selectAll(){
  selected = new Set(historyLog.map((_,i)=>i));
  lastFullHistoryHTML = "";
  renderHistoryFull();
}

function clearSelection(){
  selected.clear();
  lastFullHistoryHTML = "";
  renderHistoryFull();
}

function deleteSelected(){
  historyLog = historyLog.filter((_,i)=>!selected.has(i));
  localStorage.setItem("historyLog", JSON.stringify(historyLog));
  selected.clear();
  lastHistoryHTML = "";
  lastFullHistoryHTML = "";
  renderHistoryFull();
  renderHistory();
}

function copySelected(){
  const text = historyLog
    .filter((_,i)=>selected.has(i))
    .map(x=>historyDisplayText(x))
    .join("\n");

  navigator.clipboard.writeText(text);
}

function openSettings(){
  els.modal.style.display = "flex";
  els.taxInput.value = taxRate;
  els.freeInput.value = freeExpr;
  els.vibCheck.checked = vibration;
  els.darkCheck.checked = darkMode;
  els.decimalSelect.value = decimalPlaces;
}

function closeSettings(){
  els.modal.style.display = "none";
}

function saveSettings(){
  taxRate = parseFloat(els.taxInput.value) || 10;
  freeExpr = els.freeInput.value.trim();
  vibration = els.vibCheck.checked;
  darkMode = els.darkCheck.checked;
  decimalPlaces = Number(els.decimalSelect.value);

  localStorage.setItem("taxRate", taxRate);
  localStorage.setItem("freeExpr", freeExpr);
  localStorage.setItem("vibration", vibration);
  localStorage.setItem("darkMode", darkMode);
  localStorage.setItem("decimalPlaces", decimalPlaces);

  applyTheme();
  closeSettings();
  update();
}

document.addEventListener("keydown",(e)=>{
  if(e.key === "Escape") clearAll();
  if(e.key >= "0" && e.key <= "9") pressNumber(e.key);
  if(e.key === ".") pressDot();
  if(["+","-","*","/"].includes(e.key)) pressOperator(e.key);
  if(e.key === "Enter") calc();
  if(e.key === "Backspace") backspace();
});

applyTheme();
update();
</script>
</body>
</html>
